<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EpiTunes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,1,0">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/index.js"></script>
</head>

<body>
    <div class="app d-flex flex-column">

        <div class="app-body row g-0 flex-nowrap flex-grow-1 overflow-hidden">
            <!-- SIDEBAR -->
            <aside class="sidebar col-md-1 col-lg-2 d-none d-md-flex flex-column overflow-auto p-1 p-lg-2">

                <a href="index.html"
                    class="d-flex align-items-center justify-content-cente justify-content-lg-start text-decoration-none text-white py-3 px-lg-2 mb-2">
                    <span class="brand-mark d-inline-flex align-items-center justify-content-center">E</span>
                    <span class="brand-name d-none d-lg-inline ps-1">EpiTunes</span>
                </a>

                <nav class="sidebar-nav flex-column gap-1">
                    <a href="index.html" class="side-link active mb-2">
                        <span class="icon">🏠</span><span class="d-none d-lg-inline">Home</span>
                    </a>
                    <a href="search.html" class="side-link">
                        <span class="icon">🔍</span><span class="d-none d-lg-inline">Cerca</span>
                    </a>
                </nav>
                <!-- sezione preferiti -->

                <p class="sidebar-section-title d-none d-lg-block mt-4 mb-2">I tuoi preferiti</p>
                <ul class="sidebar-list list-unstyled d-none d-lg-block" id="sidebar-favs">
                    <li class="fst-italic">Ancora nessuno</li>
                </ul>


            </aside>
            <main class="col overflow-auto">

                <!-- HEADER -->
                <header class="topbar sticky-top d-flex align-items-center justify-content-between px-4">

                    <div class="topbar-nav d-flex align-items-center gap-2">

                        <div class="brand-mark d-md-none d-flex align-items-center justify-content-center">E</div>

                        <button class="nav-btn btn rounded-circle" type="button">
                            &lt;
                        </button>

                        <button class="nav-btn btn rounded-circle" type="button">
                            &gt;
                        </button>

                        <!-- SIMBOLI MOBILE ONLY (HOME-SEARCH) -->
                        <a href="index.html" class="mobile-only btn d-md-none">
                            <span class="material-symbols-rounded">home</span>
                        </a>

                        <a href="search.html" class="mobile-only btn d-md-none">
                            <span class="material-symbols-rounded">search</span>
                        </a>



                    </div>
                    <!-- ICONA UTENTE -->
                    <div class="user-pill">
                        <i class="fa-solid fa-user"></i>
                    </div>

                </header>

                <!-- END -->

                <!-- HOME -->
                <section class="home container-fluid p-4">

                    <!-- RIPRODOTTI DI RECENTE -->
                    <section class="row">
                        <h2>Riprodotti di recente</h2>

                        <div id="grid-recent" class="grid row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3">

                        </div>
                    </section>

                    <!-- PREFERITI -->
                    <section class="row">
                        <h2>I tuoi preferiti</h2>

                        <div id="grid-favorites" class="grid row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3">

                        </div>
                    </section>

                    <!-- SUGGERIMENTI POP -->
                    <section class="row">
                        <h2>Suggerimenti pop</h2>

                        <div id="grid-pop" class="grid row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3">
                            <!-- <div class="col">
                                    <div class="card"></div>
                                </div> -->

                        </div>

                    </section>

                    <!-- SUGGERIMENTI ROCK -->
                    <section class="row">
                        <h2>Suggerimenti rock</h2>

                        <div id="grid-rock" class="grid row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3">

                        </div>
                    </section>

                </section>
            </main>
        </div>
        <!-- PLAYER/FOOTER -->
        <footer class="player flex-shrink-0 d-flex align-items-center">

            <div class="row align-items-center w-100 g-0">

                <!-- BRANO SELEZIONATO -->
                <div class="player-track col-4 col-md-4 d-flex align-items-center gap-2">
                    <div class="player-cover">
                        <img src="https://placehold.co/112x112/000000/000000" alt="Copertina brano" class="img-fluid">
                    </div>

                    <div class="player-meta">
                        <p class="player-title">Seleziona un brano</p>
                        <p class="player-artist">-</p>
                    </div>
                </div>

                <!-- PLAYER CENTRALE -->
                <div class="player-center col-4 col-md-4 d-flex flex-column align-items-center">

                    <div class="player-controls d-flex align-items-center justify-content-center gap-1 gap-md-3">

                        <button class="btn-ctrl" type="button">
                            <span class="material-symbols-rounded">shuffle</span>
                        </button>

                        <button class="btn-ctrl" type="button">
                            <span class="material-symbols-rounded">skip_previous</span>
                        </button>

                        <button class="btn-play" type="button">
                            <span class="material-symbols-rounded">play_arrow</span>
                        </button>

                        <button class="btn-ctrl" type="button">
                            <span class="material-symbols-rounded">skip_next</span>
                        </button>

                        <button class="btn-ctrl" type="button">
                            <span class="material-symbols-rounded">repeat</span>
                        </button>

                    </div>

                    <!-- BARRA AVANZAMENTO BRANO -->
                    <div class="player-progress d-flex align-items-center gap-2">
                        <span class="current-time">0:00</span>

                        <div class="progress-bar">
                            <div class="progress-fill"></div>
                        </div>

                        <span class="duration">0:00</span>
                    </div>

                </div>

                <!-- VOLUME -->
                <div class="player-right col-4 col-md-4 d-flex align-items-center justify-content-end">

                    <div class="dropup">
                        <button class="btn-ctrl" type="button" data-bs-toggle="dropdown" data-bs-display="static"
                            aria-expanded="false">
                            <span class="material-symbols-rounded" id="volume-icon">volume_up</span>
                        </button>

                        <div class="dropdown-menu">
                            <input type="range" class="form-range volume-control" min="0" max="100" value="30">
                        </div>
                    </div>
                </div>
            </div>
        </footer>
    </div>
</body>

</html>
